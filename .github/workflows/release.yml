name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Build precompiled runtime
        run: npm run build
      - name: Verify committed runtime matches build
        run: git diff --exit-code -- lib
      - name: Verify pinned protocol fixture
        working-directory: protocol
        run: shasum -a 256 -c SHA256SUMS
      - name: Test protocol and client
        run: npm test
      - name: Test isolated packaging
        run: npm run test:packaging
      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build offline package
        run: npm run pack:tgz
      - name: Prepare release notes
        run: |
          cat > release-notes.md <<EOF
          ## AgentPet Lite DSH bridge ${GITHUB_REF_NAME}

          npm: https://www.npmjs.com/package/@agentpet-lite/dsh-bridge/v/${VERSION}
          Source: https://github.com/${GITHUB_REPOSITORY}

          ### Install

          \`\`\`sh
          dsh plugin --profile desktop add @agentpet-lite/dsh-bridge@${VERSION}
          \`\`\`

          ### Verification

          - Node and isolated packaging tests passed in this workflow.
          - Offline asset: \`agentpet-lite-dsh-bridge-${VERSION}.tgz\` (see \`SHA256SUMS\`).
          - Natural desktop task/navigation acceptance is separate from these checks.

          DSH compatibility: \`>=0.2.1-rc.2\`. MIT license; third-party notices are included.
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "build/package/agentpet-lite-dsh-bridge-${VERSION}.tgz"
            "build/package/SHA256SUMS"
          )
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            "${assets[@]}"
